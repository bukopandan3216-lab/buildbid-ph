version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: buildbid_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-buildbid_root}
      MYSQL_DATABASE: ${MYSQL_DB:-buildbid_ph}
      MYSQL_USER: ${MYSQL_USER:-buildbid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-buildbid_pass}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: buildbid_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: mysql://${MYSQL_USER:-buildbid}:${MYSQL_PASSWORD:-buildbid_pass}@db:3306/${MYSQL_DB:-buildbid_ph}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:5173
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildbid_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:5000

volumes:
  mysql_data:
